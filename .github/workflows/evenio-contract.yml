name: Evenio contract

on:
  pull_request:
    paths:
      - 'docs/evenio/**'
      - 'deploy/evenio/**'
      - 'scripts/check-evenio-*.mjs'
      - 'server/src/adapters/evenio-control/**'
      - 'server/src/adapters/registry.ts'
      - 'server/src/adapters/builtin-adapter-types.ts'
      - 'server/package.json'
      - 'ui/src/adapters/registry.ts'
      - 'cli/src/adapters/registry.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/evenio-contract.yml'
  push:
    branches:
      - 'evenio/**'
    paths:
      - 'docs/evenio/**'
      - 'deploy/evenio/**'
      - 'scripts/check-evenio-*.mjs'
      - 'server/src/adapters/evenio-control/**'
      - 'server/src/adapters/registry.ts'
      - 'server/src/adapters/builtin-adapter-types.ts'
      - 'server/package.json'
      - 'ui/src/adapters/registry.ts'
      - 'cli/src/adapters/registry.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/evenio-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-evenio-architecture-contract.mjs
      - run: node scripts/check-evenio-managed-host-config.mjs
      - run: node scripts/check-evenio-identity-contract.mjs
      - run: node scripts/check-evenio-delegation-contract.mjs
      - run: node scripts/check-evenio-adapter-implementation.mjs
      - run: corepack enable
      - run: pnpm install --ignore-scripts --no-frozen-lockfile --filter @paperclipai/server...
      - run: pnpm --filter @paperclipai/server exec tsc -p src/adapters/evenio-control/tsconfig.json --noEmit
